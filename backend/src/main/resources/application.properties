spring.config.import=optional:classpath:application-secret.properties

server.port=8080

spring.application.name=medical-search

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true

app.time-zone=Asia/Seoul
app.cors.allowed-origins[0]=http://localhost:5173
app.public-data.enabled=${PUBLIC_DATA_ENABLED:true}
app.public-data.hospital-full-data-url=${DATA_GO_KR_HOSPITAL_FULL_DATA_URL:https://apis.data.go.kr/B552657/HsptlAsembySearchService/getHsptlMdcncFullDown}
app.public-data.hospital-department-list-url=${DATA_GO_KR_HOSPITAL_DEPARTMENT_LIST_URL:https://apis.data.go.kr/B552657/HsptlAsembySearchService/getHsptlMdcncListInfoInqire}
app.public-data.pharmacy-full-data-url=${DATA_GO_KR_PHARMACY_FULL_DATA_URL:https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService/getParmacyFullDown}
app.public-data.emergency-bed-availability-url=${DATA_GO_KR_EMERGENCY_BED_AVAILABILITY_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService/getEmrrmRltmUsefulSckbdInfoInqire}
app.public-data.timeout=${DATA_GO_KR_TIMEOUT:20s}
app.public-data.sync-page-size=${DATA_GO_KR_SYNC_PAGE_SIZE:1000}
app.public-data.sync-on-startup=${DATA_GO_KR_SYNC_ON_STARTUP:true}
app.public-data.sync-cron=${DATA_GO_KR_SYNC_CRON:0 0 3 * * *}
app.naver-maps.geocoding-url=${NAVER_MAPS_GEOCODING_URL:https://maps.apigw.ntruss.com/map-geocode/v2/geocode}
app.naver-maps.timeout=${NAVER_MAPS_TIMEOUT:10s}

# Local bootstrap account for the developer dashboard. Override the password in deployed environments.
app.developer-account.enabled=${MEDION_DEVELOPER_ACCOUNT_ENABLED:true}
app.developer-account.username=${MEDION_DEVELOPER_USERNAME:admin}
app.developer-account.password=${MEDION_DEVELOPER_PASSWORD:12341234}
