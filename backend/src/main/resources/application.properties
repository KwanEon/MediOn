server.port=8080

spring.application.name=medical-search

spring.datasource.url=jdbc:mysql://localhost:3306/medical_search
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true

app.time-zone=Asia/Seoul
app.cors.allowed-origins[0]=http://localhost:5173
app.public-data.enabled=${PUBLIC_DATA_ENABLED:true}
app.public-data.service-key=${DATA_GO_KR_SERVICE_KEY:}
app.public-data.hospital-location-enabled=${DATA_GO_KR_HOSPITAL_LOCATION_ENABLED:true}
app.public-data.emergency-medical-enabled=${DATA_GO_KR_EMERGENCY_MEDICAL_ENABLED:true}
app.public-data.hospital-url=${DATA_GO_KR_HOSPITAL_URL:https://apis.data.go.kr/B552657/HsptlAsembySearchService/getHsptlMdcncLcinfoInqire}
app.public-data.hospital-list-url=${DATA_GO_KR_HOSPITAL_LIST_URL:https://apis.data.go.kr/B552657/HsptlAsembySearchService/getHsptlMdcncListInfoInqire}
app.public-data.pharmacy-url=${DATA_GO_KR_PHARMACY_URL:https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService/getParmacyLcinfoInqire}
app.public-data.pharmacy-list-url=${DATA_GO_KR_PHARMACY_LIST_URL:https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService/getParmacyListInfoInqire}
app.public-data.emergency-url=${DATA_GO_KR_EMERGENCY_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService/getEgytLcinfoInqire}
app.public-data.emergency-list-url=${DATA_GO_KR_EMERGENCY_LIST_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService/getEgytListInfoInqire}
app.public-data.emergency-availability-url=${DATA_GO_KR_EMERGENCY_AVAILABILITY_URL:https://apis.data.go.kr/B552657/ErmctInfoInqireService/getEmrrmRltmUsefulSckbdInfoInqire}
app.public-data.timeout=${DATA_GO_KR_TIMEOUT:20s}
app.public-data.cache-ttl=${DATA_GO_KR_CACHE_TTL:2m}
app.public-data.emergency-availability-cache-ttl=${DATA_GO_KR_EMERGENCY_AVAILABILITY_CACHE_TTL:1m}
app.public-data.operating-hours-cache-ttl=${DATA_GO_KR_OPERATING_HOURS_CACHE_TTL:1h}
app.public-data.max-operating-hours-rows=${DATA_GO_KR_MAX_OPERATING_HOURS_ROWS:5000}
app.public-data.max-results=${DATA_GO_KR_MAX_RESULTS:1000}
app.open-street-map.enabled=${OSM_OVERPASS_ENABLED:true}
app.open-street-map.overpass-url=${OSM_OVERPASS_URL:https://overpass.private.coffee/api/interpreter}
app.open-street-map.fallback-urls[0]=${OSM_OVERPASS_FALLBACK_URL_1:https://overpass-api.de/api/interpreter}
app.open-street-map.fallback-urls[1]=${OSM_OVERPASS_FALLBACK_URL_2:https://maps.mail.ru/osm/tools/overpass/api/interpreter}
app.open-street-map.timeout=${OSM_OVERPASS_TIMEOUT:15s}
app.naver-maps.geocoding-url=${NAVER_MAPS_GEOCODING_URL:https://maps.apigw.ntruss.com/map-geocode/v2/geocode}
app.naver-maps.api-key-id=${NAVER_MAPS_API_KEY_ID:}
app.naver-maps.api-key=${NAVER_MAPS_API_KEY:}
app.naver-maps.timeout=${NAVER_MAPS_TIMEOUT:10s}
